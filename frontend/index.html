<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/applogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Preconnect to image CDN for faster asset delivery without unused preload warnings -->
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">

  <style>
    @keyframes dash_682 {
      72.5% { opacity: 0; }
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; font-family: 'Plus Jakarta Sans', Inter, sans-serif; z-index: 9999999;">
      <div class="loading" style="margin-bottom: 24px;">
        <svg width="64px" height="48px" viewBox="0 0 64 48">
          <polyline points="0.157 23.954, 14 23.954, 21.843 48, 43 0, 50 24, 64 24" id="back" style="fill: none; stroke: #ff4d5033; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"></polyline>
          <polyline points="0.157 23.954, 14 23.954, 21.843 48, 43 0, 50 24, 64 24" id="front" style="fill: none; stroke: #ff4d4f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 48, 144; stroke-dashoffset: 192; animation: dash_682 1.4s linear infinite;"></polyline>
        </svg>
      </div>
      <div style="text-align: center;">
        <h1 style="font-size: 32px; font-weight: 800; margin: 0 0 6px 0; background: linear-gradient(to right, #0284c7, #0d9488, #16a34a); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Medisphere</h1>
        <p style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.25em; margin: 0;">Hospital &amp; Research Center</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
